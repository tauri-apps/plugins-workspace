[package]
name = "tauri-plugin-biometric"
version = "2.3.2"
description = "Prompt the user for biometric authentication on Android, iOS and macOS."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-biometric"
exclude = ["/guest-js", "/package.json", "/rollup.config.js", "/tsconfig.json"]

[package.metadata.docs.rs]
targets = ["x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "partial", notes = "Touch ID via LocalAuthentication. Android-only and iOS-only options are ignored." }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }


[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde_repr = "0.1"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "LAContext",
  "LABiometryType",
  "LAPublicDefines",
] }
block2 = "0.6"
