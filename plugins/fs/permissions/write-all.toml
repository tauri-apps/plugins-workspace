"$schema" = "schemas/schema.json"

[[permission]]
identifier = "write-all"
description = "This enables all write related commands without any pre-configured accessible paths."
commands.allow = [
  "mkdir",
  "create",
  "copy_file",
  "remove",
  "rename",
  "truncate",
  "ftruncate",
  "write",
  "write_file",
  "write_text_file",
  # used by `writeFile` with a stream and by the `FileHandle` returned by `create` and `open`
  "open",
  "seek",
  "fstat",
]
