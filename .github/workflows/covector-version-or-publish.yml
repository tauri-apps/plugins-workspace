name: version or publish

on:
  push:
    branches:
      - v1
      - v2

permissions:
  # required for oidc token
  id-token: write
  # required to create the GitHub Release
  contents: write
  # required for creating the Version Packages Release
  pull-requests: write

jobs:
  # covector publishes once no change files are left (the version update PR consumed them) and
  # otherwise opens that PR, which does not need the tests below.
  check-publish:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if find .changes -maxdepth 1 -name '*.md' ! -iname 'readme.md' | grep -q .; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  integration-tests:
    needs: check-publish
    if: needs.check-publish.outputs.publish == 'true'
    uses: ./.github/workflows/integration-tests.yml

  test-api-e2e:
    needs: check-publish
    if: needs.check-publish.outputs.publish == 'true'
    uses: ./.github/workflows/test-api-e2e.yml
    secrets: inherit

  test-api-e2e-mobile:
    needs: check-publish
    if: needs.check-publish.outputs.publish == 'true'
    uses: ./.github/workflows/test-api-e2e-mobile.yml

  version-or-publish:
    needs:
      - integration-tests
      - test-api-e2e
      - test-api-e2e-mobile
    # the tests are skipped when covector only versions
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      change: ${{ steps.covector.outputs.change }}
      commandRan: ${{ steps.covector.outputs.commandRan }}
      successfulPublish: ${{ steps.covector.outputs.successfulPublish }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for use of git history

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: cargo login
        run: cargo login ${{ secrets.ORG_CRATES_IO_TOKEN }}

      - name: git config
        run: |
          git config --global user.name "${{ github.event.pusher.name }}"
          git config --global user.email "${{ github.event.pusher.email }}"

      - name: Setup target dir on /mnt
        # This directory has a larger partition size
        run: |
          sudo mkdir /mnt/target
          WORKSPACE_OWNER="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
          sudo chown -R "${WORKSPACE_OWNER}" /mnt/target

      - name: covector version or publish (publish when no change files present)
        uses: jbolda/covector/packages/action@covector-v0
        id: covector
        env:
          CARGO_TARGET_DIR: /mnt/target
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: 'version-or-publish'
          createRelease: true
          recognizeContributors: true

      - name: Sync Cargo.lock
        if: steps.covector.outputs.commandRan == 'version'
        run: cargo tree --depth 0

      - name: Create Pull Request With Versions Bumped
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        if: steps.covector.outputs.commandRan == 'version'
        with:
          title: 'Publish New Versions (${{ github.ref_name }})'
          commit-message: 'publish new versions'
          labels: 'version updates'
          branch: 'ci/release-${{ github.ref_name }}'
          body: ${{ steps.covector.outputs.change }}
          sign-commits: true
