name: test android

on:
  pull_request:
    paths:
      - '.github/workflows/test-android.yml'
      - '**/android/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    # No caches on purpose: this workflow only runs on pull requests, so anything it saved
    # would live on the merge ref where no other run can restore it, while still counting
    # against the repository's 10 GB cache limit and evicting entries that `v2`/`v3` saved.
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.90

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - uses: pnpm/action-setup@v6
        with:
          run_install: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25

      # TODO check after https://github.com/nttld/setup-ndk/issues/518 is fixed
      - name: Restore Android Symlinks
        if: matrix.platform == 'ubuntu-latest' || matrix.platform == 'macos-latest'
        env:
          NDK_HOST: ${{ matrix.platform == 'ubuntu-latest' && 'linux-x86_64' || 'darwin-x86_64' }}
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/$NDK_HOST/bin"
          find "$directory" -type l | while read link; do
              current_target=$(readlink "$link")
              new_target="$directory/$(basename "$current_target")"
              ln -sf "$new_target" "$link"
              echo "Changed $(basename "$link") from $current_target to $new_target"
          done

      - name: build API
        run: pnpm build

      - name: build APK
        working-directory: ./examples/api
        run: pnpm tauri android build
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
