name: Audit JavaScript

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - v1
      - v2
    paths:
      - '.github/workflows/audit-javascript.yml'
      - '**/pnpm-lock.yaml'
      - '**/package.json'
  pull_request:
    branches:
      - v1
      - v2
    paths:
      - '.github/workflows/audit-javascript.yml'
      - '**/pnpm-lock.yaml'
      - '**/package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  audit-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
          cache: true # the pnpm store, keyed by OS and lockfile hash and shared by every workflow
      - name: audit
        run: pnpm audit
