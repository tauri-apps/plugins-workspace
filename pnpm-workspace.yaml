packages:
  - packages/*
  - plugins/*
  - plugins/*/examples/*
  - examples/*

allowBuilds:
  # appium's postinstall only auto-installs drivers for global installs; ours
  # are regular devDependencies of packages/api-e2e, which appium picks up on
  # its own, so there is nothing for it to do
  appium: false
  # transitive deps of @wdio/utils; their postinstall downloads browser drivers
  # the desktop e2e suite never uses (it drives the app via tauri-driver)
  edgedriver: false
  esbuild: true
  geckodriver: false

minimumReleaseAgeExclude:
  - '@tauri-apps/cli-darwin-arm64@3.0.0-alpha.0'
  - '@tauri-apps/cli-darwin-x64@3.0.0-alpha.0'
  - '@tauri-apps/cli-linux-arm-gnueabihf@3.0.0-alpha.0'
  - '@tauri-apps/cli-linux-arm64-gnu@3.0.0-alpha.0'
  - '@tauri-apps/cli-linux-arm64-musl@3.0.0-alpha.0'
  - '@tauri-apps/cli-linux-riscv64-gnu@3.0.0-alpha.0'
  - '@tauri-apps/cli-linux-x64-gnu@3.0.0-alpha.0'
  - '@tauri-apps/cli-linux-x64-musl@3.0.0-alpha.0'
  - '@tauri-apps/cli-win32-arm64-msvc@3.0.0-alpha.0'
  - '@tauri-apps/cli-win32-ia32-msvc@3.0.0-alpha.0'
  - '@tauri-apps/cli-win32-x64-msvc@3.0.0-alpha.0'
  - '@tauri-apps/cli@3.0.0-alpha.0'
  - '@tauri-apps/api@3.0.0-alpha.1'
  - appium-uiautomator2-driver@9.2.2
  - appium-xcuitest-driver@13.1.3

overrides:
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  sharp@<0.35.5: ^0.35.5
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
